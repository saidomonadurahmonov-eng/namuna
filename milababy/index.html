<!doctype html>
<html lang="uz">
<head>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --accent: #A91881;
    --bg: #f5f5f4; --card: #ffffff; --text: #1c1917; --muted: #78716c;
    --line: #e7e5e4; --soft: #fafaf9; --ok: #15803d;
  }
  .dark { --bg: #121212; --card: #1e1e1e; --text: #f5f5f4; --muted: #a8a29e; --line: #2e2e2e; --soft: #262626; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.4 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif; padding-bottom: 96px; }
  header { background: var(--accent); color: #fff; padding: 18px 16px 22px; }
  .shop { display: flex; align-items: center; gap: 12px; }
  .ava { width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,.25) center/cover;
         flex: none; border: 2px solid rgba(255,255,255,.6); display: grid; place-items: center; font-weight: 700; font-size: 22px; }
  .shop h1 { margin: 0; font-size: 19px; line-height: 1.2; }
  .shop small { opacity: .85; font-size: 13px; }
  .pill { display: inline-block; margin-top: 4px; background: rgba(255,255,255,.22); border-radius: 99px;
          padding: 2px 9px; font-size: 11px; letter-spacing: .3px; }
  .search { margin: -14px 16px 0; position: relative; }
  .search input { width: 100%; border: 1px solid var(--line); background: var(--card); color: var(--text);
                  border-radius: 12px; padding: 12px 14px; font-size: 15px; outline: none; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 14px 16px 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
          border-radius: 99px; padding: 7px 14px; font-size: 13px; }
  .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px 16px; }
  .card { background: var(--card); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
          box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .card .img { aspect-ratio: 4/5; background: var(--soft) center/cover no-repeat; }
  .card .body { padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card .name { font-weight: 600; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.8em; }
  .price { font-weight: 700; color: var(--accent); font-size: 14px; }
  .price.ask { color: var(--muted); font-weight: 500; font-size: 13px; }
  .add { margin-top: auto; border: 0; background: var(--accent); color: #fff; border-radius: 10px; padding: 9px; font-size: 14px; font-weight: 600; }
  .add.in { background: var(--soft); color: var(--accent); border: 1px solid var(--accent); }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; grid-column: 1/-1; }
  .bar { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); background: var(--accent); color: #fff;
         border-radius: 14px; padding: 14px 16px; display: none; justify-content: space-between; align-items: center;
         font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.2); z-index: 5; }
  .bar.show { display: flex; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 9; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-radius: 18px 18px 0 0;
           max-height: 88vh; overflow-y: auto; padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); z-index: 10; display: none; }
  .sheet.show, .sheet-bg.show { display: block; }
  .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 6px auto 12px; }
  .sheet h2 { margin: 4px 0 10px; font-size: 18px; }
  .big { width: 100%; aspect-ratio: 4/5; max-height: 52vh; object-fit: contain; background: var(--soft); border-radius: 12px; }
  .desc { color: var(--muted); white-space: pre-line; margin: 10px 0; font-size: 14px; }
  .row { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row img { width: 54px; height: 66px; object-fit: cover; border-radius: 8px; background: var(--soft); }
  .row .n { flex: 1; font-size: 14px; }
  .qty { display: flex; align-items: center; gap: 10px; }
  .qty button { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line); background: var(--soft); color: var(--text); font-size: 18px; }
  .btn { width: 100%; border: 0; background: var(--accent); color: #fff; border-radius: 12px; padding: 15px; font-size: 16px; font-weight: 600; margin-top: 14px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 5px; }
  .field { width: 100%; border: 1px solid var(--line); background: var(--soft); color: var(--text); border-radius: 10px; padding: 12px; font-size: 15px; }
  .done { text-align: center; padding: 18px 4px 6px; }
  .done .tick { width: 64px; height: 64px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; font-size: 32px; margin: 4px auto 12px; }
  .note { background: var(--soft); border: 1px dashed var(--line); border-radius: 12px; padding: 12px; text-align: left; font-size: 13px; color: var(--muted); margin-top: 14px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 4px 16px 20px; }
  footer a { color: var(--muted); }
</style>
</head>
<body data-v="20261007100555">
<header>
  <div class="shop">
    <div class="ava" id="ava"></div>
    <div>
      <h1 id="title"></h1>
      <small id="sub"></small><br>
      <span class="pill" id="pill"></span>

<div class="search"><input id="q" type="search" autocomplete="off"></div>

<script type="application/json" id="data">{"dokon": "🪽🩷𝓜𝓲𝓵𝓪_𝓑𝓪𝓫𝔂_𝓚𝓲𝓭𝓼🩷🪽", "kanal": "mila_baby_kids", "ava": "img/ava.jpg", "accent": "#A91881", "kiril": false, "mahsulotlar": [{"id": "53916", "nom": "Burberry to'plami", "narx": "450 000 so'm", "narx_son": 450000, "tavsif": "100-150 sm o'lchamli, premium sifatli Burberry bolalar kostyumi", "turkum": null, "rasm": "img/53916.jpg"}, {"id": "53910", "nom": "Dior kurtka to'plami", "narx": "495 000 so'm", "narx_son": 495000, "tavsif": "100-150 sm o'lchamli, premium kachestva Dior kurtka va shim to'plami", "turkum": null, "rasm": "img/53910.jpg"}, {"id": "53888", "nom": "Troyka: palto, vatalaska, shim", "narx": "495 000 so'm", "narx_son": 495000, "tavsif": "1-7 yosh uchun noodatiy tayyor look, mexli troyka to'plam", "turkum": null, "rasm": "img/53888.jpg"}, {"id": "53884", "nom": "Troyka kostyum", "narx": "350 000 so'm", "narx_son": 350000, "tavsif": "90-120 sm o'lchamli, super narxdagi troyka kostyum", "turkum": null, "rasm": "img/53884.jpg"}, {"id": "53892", "nom": "Sport kostyumi", "narx": "395 000 so'm", "narx_son": 395000, "tavsif": "Yangi kelgan qizlar uchun ulgurji sport kostyumi", "turkum": null, "rasm": "img/53892.jpg"}, {"id": "53878", "nom": "Dvoyka to'plam", "narx": "330 000 so'm", "narx_son": 330000, "tavsif": "100-140 sm gacha o'lchamli, yangi kolleksiyadan dvoyka to'plam", "turkum": null, "rasm": "img/53878.jpg"}]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const T = D.kiril ? {
  pill: 'НАМУНА-ИЛОВА', sub: 'Телеграм дўкони', q: 'Қидириш...', all: 'Ҳаммаси', add: 'Саватга', inCart: 'Саватда ✓',
  ask: 'Нархини сўранг', cart: 'Сават', items: 'та маҳсулот', order: 'Буюртма бериш', name: 'Исмингиз', phone: 'Телефон рақамингиз',
  send: 'Буюртмани юбориш', done: 'Буюртмангиз қабул қилинди!', doneSub: 'Тез орада сиз билан боғланамиз.',
  note: 'Бу — намуна. Ҳақиқий иловада шу буюртма дўкон эгасига Телеграмда дарҳол етиб боради: ким, нима, телефони — ҳаммаси тайёр рўйхат бўлиб.',
  close: 'Ёпиш', empty: 'Ҳеч нарса топилмади', total: 'Жами', foot: 'Намуна-илова · Мумтоз жамоаси тайёрлади', addBig: 'Саватга қўшиш', fill: 'Исм ва телефонни киритинг'
} : {
  pill: 'NAMUNA-ILOVA', sub: 'Telegram do‘koni', q: 'Qidirish...', all: 'Hammasi', add: 'Savatga', inCart: 'Savatda ✓',
  ask: 'Narxini so‘rang', cart: 'Savat', items: 'ta mahsulot', order: 'Buyurtma berish', name: 'Ismingiz', phone: 'Telefon raqamingiz',
  send: 'Buyurtmani yuborish', done: 'Buyurtmangiz qabul qilindi!', doneSub: 'Tez orada siz bilan bog‘lanamiz.',
  note: 'Bu — namuna. Haqiqiy ilovada shu buyurtma do‘kon egasiga Telegram’da darhol yetib boradi: kim, nima, telefoni — hammasi tayyor ro‘yxat bo‘lib.',
  close: 'Yopish', empty: 'Hech narsa topilmadi', total: 'Jami', foot: 'Namuna-ilova · Mumtoz jamoasi tayyorladi', addBig: 'Savatga qo‘shish', fill: 'Ism va telefonni kiriting'
};
const tg = window.Telegram && Telegram.WebApp;
if (tg && tg.initData !== undefined) { try { tg.ready(); tg.expand(); if (tg.colorScheme === 'dark') document.body.classList.add('dark'); tg.setHeaderColor && tg.setHeaderColor(D.accent); } catch (e) {} }
const haptic = () => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light'); } catch (e) {} };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n.toLocaleString('ru-RU').replace(/,/g, ' ') + (D.kiril ? ' сўм' : ' so‘m');
const cart = {};
let cat = null;

$('title').textContent = D.dokon; $('sub').textContent = (D.kanal ? '@' + D.kanal + ' · ' : '') + T.sub;
$('pill').textContent = T.pill; $('q').placeholder = T.q; $('foot').textContent = T.foot;
if (D.ava) $('ava').style.backgroundImage = `url(${D.ava})`; else $('ava').textContent = (D.dokon || '?').trim()[0];
document.title = D.dokon;

const cats = [...new Set(D.mahsulotlar.map(m => m.turkum).filter(Boolean))];
if (cats.length > 1) {
  const mk = (label, val) => { const b = document.createElement('button'); b.className = 'chip' + (cat === val ? ' on' : ''); b.textContent = label;
    b.onclick = () => { cat = val; renderChips(); render(); }; return b; };
  window.renderChips = () => { const c = $('chips'); c.innerHTML = ''; c.append(mk(T.all, null), ...cats.map(x => mk(x, x))); };
  renderChips();
} else { $('chips').style.display = 'none'; }

function priceHtml(m) {
  if (m.narx_son) return `<div class="price">${fmt(m.narx_son)}</div>`;
  return m.narx ? `<div class="price">${esc(m.narx)}</div>` : `<div class="price ask">${T.ask}</div>`;
}
function render() {
  const q = $('q').value.trim().toLowerCase();
  const list = D.mahsulotlar.filter(m => (!cat || m.turkum === cat) && (!q || (m.nom + ' ' + (m.tavsif || '')).toLowerCase().includes(q)));
  $('grid').innerHTML = list.length ? list.map(m => `
    <div class="card">
      <div class="img" style="background-image:url('${esc(m.rasm)}')" onclick="openItem('${m.id}')"></div>
      <div class="body">
        <div class="name" onclick="openItem('${m.id}')">${esc(m.nom)}</div>
        ${priceHtml(m)}
        <button class="add ${cart[m.id] ? 'in' : ''}" onclick="add('${m.id}')">${cart[m.id] ? T.inCart : T.add}</button>
      </div>
    </div>`).join('') : `<div class="empty">${T.empty}</div>`;
}
$('q').oninput = render;

function add(id) { cart[id] = (cart[id] || 0) + 1; haptic(); render(); bar(); }
function bar() {
  const ids = Object.keys(cart).filter(k => cart[k] > 0);
  const n = ids.reduce((s, k) => s + cart[k], 0);
  $('bar').classList.toggle('show', n > 0);
  $('barL').textContent = `🛒 ${n} ${T.items}`;
  const all = ids.every(k => byId(k).narx_son);
  $('barR').textContent = all && n ? fmt(ids.reduce((s, k) => s + cart[k] * byId(k).narx_son, 0)) : T.cart + ' →';
}
const byId = id => D.mahsulotlar.find(m => m.id === id);
function sheet(html) { $('sheet').innerHTML = '<div class="grab"></div>' + html; $('sheet').classList.add('show'); $('bg').classList.add('show'); }
function closeSheet() { $('sheet').classList.remove('show'); $('bg').classList.remove('show'); }
$('bg').onclick = closeSheet;

function openItem(id) {
  const m = byId(id);
  sheet(`<img class="big" src="${esc(m.rasm)}" alt="">
    <h2>${esc(m.nom)}</h2>${priceHtml(m)}
    ${m.tavsif ? `<div class="desc">${esc(m.tavsif)}</div>` : ''}
    <button class="btn" onclick="add('${m.id}');closeSheet()">${T.addBig}</button>`);
}
function openCart() {
  const ids = Object.keys(cart).filter(k => cart[k] > 0);
  if (!ids.length) return closeSheet();
  const all = ids.every(k => byId(k).narx_son);
  sheet(`<h2>${T.cart}</h2>` + ids.map(k => { const m = byId(k); return `
    <div class="row"><img src="${esc(m.rasm)}" alt=""><div class="n">${esc(m.nom)}<br>${priceHtml(m)}</div>
    <div class="qty"><button onclick="q2('${k}',-1)">−</button><b>${cart[k]}</b><button onclick="q2('${k}',1)">+</button></div></div>`; }).join('')
    + (all ? `<p style="text-align:right;font-weight:700">${T.total}: ${fmt(ids.reduce((s, k) => s + cart[k] * byId(k).narx_son, 0))}</p>` : '')
    + `<button class="btn" onclick="orderForm()">${T.order}</button>`);
}
function q2(id, d) { cart[id] = Math.max(0, (cart[id] || 0) + d); if (!cart[id]) delete cart[id]; render(); bar(); openCart(); }
function orderForm() {
  let nm = ''; try { nm = tg.initDataUnsafe.user.first_name || ''; } catch (e) {}
  sheet(`<h2>${T.order}</h2>
    <label>${T.name}</label><input class="field" id="fn" value="${esc(nm)}">
    <label>${T.phone}</label><input class="field" id="fp" type="tel" placeholder="+998 __ ___ __ __">
    <button class="btn" onclick="submitOrder()">${T.send}</button>`);
}
function submitOrder() {
  if (!$('fn').value.trim() || $('fp').value.replace(/\D/g, '').length < 7) { alert(T.fill); return; }
  try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
  for (const k in cart) delete cart[k]; render(); bar();
  sheet(`<div class="done"><div class="tick">✓</div><h2>${T.done}</h2><div class="desc">${T.doneSub}</div>
    <div class="note">${T.note}</div><button class="btn" onclick="closeSheet()">${T.close}</button></div>`);
}
$('bar').onclick = openCart;
render();
</script>
</body>
</html>
